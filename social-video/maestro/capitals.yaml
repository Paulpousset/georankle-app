# « Capitales » en CARRÉ : même déroulé que flags.yaml.
appId: com.paulpousset.geog
name: capitals
env:
  ROUNDS: "6"
  FAIL: "0"
  THINK_MS: "1500"
  MODE_TITLE: "Capitales|Capitals"
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/start-solo.yaml
# Écran de réglage de la partie : 10 tours (assez pour ROUNDS), puis JOUER.
- tapOn:
    text: "10 tours par manche|10 turns per set"
    optional: true
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "JOUER|PLAY"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "CARRÉ.*"
    timeout: 15000
- startRecording: ${OUTPUT || 'capitals'}
- repeat:
    times: ${ROUNDS}
    commands:
      - runFlow: subflows/quiz-round.yaml
- runFlow:
    when:
      true: ${FAIL == '1'}
    commands:
      - tapOn:
          text: "CARRÉ.*"
          waitToSettleTimeoutMs: 300
      - runFlow: subflows/think.yaml
      - tapOn:
          id: "rec-wrong"
          waitToSettleTimeoutMs: 300
- runFlow:
    file: subflows/think.yaml
    env:
      THINK_MS: "3000"
- stopRecording
