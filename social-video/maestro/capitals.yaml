# « Capitales » en CARRÉ : même déroulé que flags.yaml.
appId: com.paulpousset.geog
name: capitals
env:
  APP_LANG: fr
  APP_LANG_NAME: Français
  APP_LANG_EN: French
  ROUNDS: "6"
  FAIL: "0"
  THINK_MS: "1500"
  MODE_TITLE: "Capitales|Capitals"
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/start-solo.yaml
- extendedWaitUntil:
    visible: "CARRÉ"
    timeout: 15000
- startRecording: ${OUTPUT || 'capitals'}
- repeat:
    times: ${ROUNDS}
    commands:
      - runFlow: subflows/quiz-round.yaml
- runFlow:
    when:
      true: ${FAIL == '1'}
    commands:
      - tapOn:
          text: "CARRÉ.*"
          waitToSettleTimeoutMs: 300
      - runFlow: subflows/think.yaml
      - tapOn:
          id: "rec-wrong"
          waitToSettleTimeoutMs: 300
- runFlow:
    file: subflows/think.yaml
    env:
      THINK_MS: "3000"
- stopRecording
