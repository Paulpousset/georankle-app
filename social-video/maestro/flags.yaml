# « Drapeaux » en CARRÉ : ROUNDS drapeaux, tous justes sauf le dernier si
# FAIL=1. Même flow pour les capitales via capitals.yaml.
appId: com.paulpousset.geog
name: flags
env:
  ROUNDS: "6"
  FAIL: "0"
  THINK_MS: "1500"
  MODE_TITLE: "Drapeaux|Flags"
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/start-solo.yaml
# Écran de réglage de la partie : 10 tours (assez pour ROUNDS), puis JOUER.
- tapOn:
    text: "10 tours par manche|10 turns per set"
    optional: true
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "JOUER|PLAY"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "CARRÉ.*"
    timeout: 15000
- startRecording: ${OUTPUT || 'flags'}
- repeat:
    times: ${ROUNDS}
    commands:
      - runFlow: subflows/quiz-round.yaml
- runFlow:
    when:
      true: ${FAIL == '1'}
    commands:
      - tapOn:
          text: "CARRÉ.*"
          waitToSettleTimeoutMs: 300
      - runFlow: subflows/think.yaml
      - tapOn:
          id: "rec-wrong"
          waitToSettleTimeoutMs: 300
- runFlow:
    file: subflows/think.yaml
    env:
      THINK_MS: "3000"
# Repère de fin, juste avant l'arrêt : plan.mjs en déduit le début de la vidéo.
- runScript:
    file: subflows/mark.js
    env:
      KIND: stop
      OUT: ${OUTPUT || 'flags'}
- stopRecording
