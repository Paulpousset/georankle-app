# Lance le build `recording` à froid, sur le menu, dans la langue demandée.
# Le mode tournage coupe déjà tutoriel, popups de règles, pubs et note.
appId: com.paulpousset.geog
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Solo|SOLO"
    # L'émulateur de la CI rend en logiciel : le premier lancement est lent.
    timeout: 60000
- runFlow:
    when:
      true: ${APP_LANG != 'fr'}
    file: set-language.yaml
