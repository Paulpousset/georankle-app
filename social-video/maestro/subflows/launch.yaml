# Lance le build `recording` à froid, sur le menu, dans la langue demandée.
# Le mode tournage coupe déjà tutoriel, popups de règles, pubs et note.
appId: com.paulpousset.geog
---
# Permissions accordées d'avance : refusées, elles laissaient Android 13+
# afficher la demande de notifications par-dessus le menu (run du 04/10).
- launchApp:
    clearState: true
    permissions:
      all: allow
# Filet si une demande s'affiche malgré tout (autre version d'Android, ATT iOS).
- tapOn:
    text: "Don’t allow|Don't allow|Ne pas autoriser|Allow|Autoriser"
    optional: true
# Et si une boîte « ne répond pas » passe quand même : attendre.
- tapOn:
    text: "Wait|Attendre"
    optional: true
- extendedWaitUntil:
    visible: "Solo|SOLO"
    # L'émulateur de la CI rend en logiciel : le premier lancement est lent.
    timeout: 60000
# Toujours choisir la langue : l'app suit celle de l'appareil (anglais sur
# l'émulateur de la CI), pas celle de la vidéo.
- runFlow: set-language.yaml
