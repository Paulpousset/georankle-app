# Change la langue de l'app depuis le bouton du menu. APP_LANG_NAME est le nom
# natif affiché dans le sélecteur (src/i18n/locales.ts) : English, Español…
appId: com.paulpousset.geog
---
- tapOn:
    text: "Changer de langue|Change language"
    waitToSettleTimeoutMs: 500
# Une ligne du sélecteur s'annonce par le nom anglais (« French »), son texte
# visible est le nom natif (« Français ») : l'un ou l'autre, en entier. Un motif
# plus large attrapait le fond de la fenêtre (qui regroupe tous les textes) et
# la refermait sans rien changer : les vidéos anglaises sortaient en français.
- tapOn:
    text: "${APP_LANG_NAME}|${APP_LANG_EN}"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Solo|SOLO"
    timeout: 15000
# Vérification : le libellé du bouton de langue suit la langue de l'app
# (« Changer de langue » en français, « Change language » sinon). Le code
# « EN » seul ne suffisait pas : il apparaît aussi ailleurs à l'écran.
- extendedWaitUntil:
    visible: ${APP_LANG == 'fr' ? 'Changer de langue' : 'Change language'}
    timeout: 10000
