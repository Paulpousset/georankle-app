<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GeoG HQ</title>
<link rel="manifest" href="/hq/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoG HQ">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light;
  --page: #f6f5f1;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: #e6e5df;
  --accent: #2a78d6;
  --s1: #2a78d6; /* iOS / série 1 */
  --s2: #eb6834; /* Android / série 2 */
  --s3: #1baf7a; /* Web / série 3 */
  --good: #0ca30c; --good-ink: #006300;
  --warn: #fab219; --warn-ink: #8a5a00;
  --bad: #d03b3b; --bad-ink: #b12a2a;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --border: #2c2c2a;
    --accent: #3987e5; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-ink: #4cc94c; --warn-ink: #fab219; --bad-ink: #ef7070;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --border: #2c2c2a;
  --accent: #3987e5; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-ink: #4cc94c; --warn-ink: #fab219; --bad-ink: #ef7070;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* En-tête */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.bar { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.icon-btn { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 440px) { .brand .name { display: none; } .seg button { padding: 5px 9px; } }
.stamp { font-size: 12px; color: var(--muted); width: 100%; max-width: 1240px; margin: 4px auto 0; }

/* Onglets : barre du bas sur mobile, en ligne sur ordinateur */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; border: 0; background: none; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; padding: 4px 0;
}
nav.tabs button[aria-selected="true"] { color: var(--accent); }
@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  nav.tabs { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; padding: 0 16px; justify-content: flex-start; gap: 4px; max-width: 1272px; margin: 10px auto 0; }
  nav.tabs button { flex: none; flex-direction: row; gap: 6px; font-size: 14px; padding: 7px 12px; border-radius: 9px; }
  nav.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
}

main { max-width: 1240px; margin: 0 auto; padding: 16px; }
h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 2px 10px; font-weight: 700; }
h2.section:first-child { margin-top: 4px; }

/* Grilles */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 900px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Tuiles & cartes */
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.tile { padding: 12px 13px; display: flex; flex-direction: column; gap: 2px; }
.tile .lbl { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .val { font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.tile .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.src { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.card { padding: 14px 14px 12px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 650; }
.delta { font-size: 12px; font-weight: 650; white-space: nowrap; }
.delta.up { color: var(--good-ink); } .delta.down { color: var(--bad-ink); } .delta.flat { color: var(--muted); }

/* États */
.skel { height: 120px; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--grid), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s infinite; }
.tile .skel { height: 30px; margin-top: 4px; }
@keyframes sh { to { background-position: -200% 0; } }
.setup, .err, .empty { font-size: 13px; border-radius: 10px; padding: 10px 12px; }
.setup { background: var(--surface-2); color: var(--ink-2); }
.setup code { font-size: 11.5px; background: var(--surface); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.err { background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad-ink); word-break: break-word; }
.empty { color: var(--muted); }

/* Listes à barres */
.hlist { display: flex; flex-direction: column; gap: 7px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
.hrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.hrow .v { color: var(--ink-2); text-align: right; }
.hrow .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.hrow .fill { height: 100%; border-radius: 3px; background: var(--s1); }

/* Tableaux */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 6px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.wrap { word-break: break-word; }
.tbl td.num { white-space: nowrap; }
.scroll-x { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }

/* Graphiques */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { fill: var(--muted); font-size: 10.5px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: var(--page);
  padding: 7px 9px; border-radius: 8px; font-size: 12px; line-height: 1.35; white-space: nowrap; opacity: 0; transition: opacity .1s;
  box-shadow: 0 4px 16px rgba(0,0,0,.18);
}
.tip b { font-weight: 700; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
details.tv { margin-top: 6px; }
details.tv summary { font-size: 11.5px; color: var(--muted); cursor: pointer; list-style: none; }
details.tv summary::-webkit-details-marker { display: none; }
details.tv[open] summary { margin-bottom: 6px; }
details.tv .scroll-x { max-height: 240px; overflow-y: auto; }

/* Alertes */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; }
.alert .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; margin-top: 1px; }
.alert.bad .dot { background: var(--bad); } .alert.warn .dot { background: var(--warn); color: #3b2a00; } .alert.good .dot { background: var(--good); }
.alert small { color: var(--muted); display: block; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { color: var(--good-ink); } .pill.bad { color: var(--bad-ink); } .pill.warn { color: var(--warn-ink); }
.stars { color: var(--warn); letter-spacing: 1px; }
.review { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.review:last-child { border-bottom: 0; }
.review .meta { color: var(--muted); font-size: 11.5px; }

/* Connexion */
.login { max-width: 360px; margin: 12vh auto 0; padding: 0 16px; }
.login .card { padding: 22px; }
.login h1 { font-size: 22px; margin: 0 0 4px; }
.login p { color: var(--ink-2); margin: 0 0 16px; font-size: 14px; }
.login input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--page); margin-bottom: 10px; }
.btn { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; }
.btn.ghost { background: var(--surface-2); color: var(--ink); width: auto; padding: 8px 12px; }
.muted { color: var(--muted); }
.hide { display: none !important; }
/* Filtres (A : barre sur ordinateur, C : boutons + panneau sur téléphone) */
.filters { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.fbar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.frow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.frow + .frow { border-top: 1px solid var(--border); padding-top: 10px; }
.flbl { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.sel { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }
.fbar select, .fbar input[type=date], .sheet select, .sheet input[type=date], .addm input, .addm select { border: 1px solid var(--border); background: var(--page); border-radius: 8px; padding: 5px 8px; font-size: 13px; min-height: 32px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.check input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.fhint { font-size: 12px; color: var(--muted); margin-left: auto; }
.fmobile { display: none; }
@media (max-width: 899px) {
  .fbar { display: none; }
  .fmobile { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .fmobile .chip { white-space: nowrap; min-height: 38px; }
}
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 40; border: 0; width: 100%; cursor: pointer; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); max-width: 640px; margin: 0 auto; }
.sheet .grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--grid); }
.sheet .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet .chip { min-height: 40px; }
.sheet .btn { min-height: 48px; font-size: 16px; }

/* Croissance */
.tile .spark { display: block; width: 100%; height: 28px; margin-top: 6px; overflow: visible; }
.map svg { display: block; width: 100%; height: auto; background: var(--surface-2); border-radius: 10px; }
.map path { cursor: pointer; stroke: var(--surface); stroke-width: .4; }
.map path.on { stroke: var(--ink); stroke-width: 1.4; }
.map path:hover { opacity: .78; }
.scale { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.scale i { width: 22px; height: 9px; border-radius: 3px; display: inline-block; }
.tbl td.heat { text-align: center; font-weight: 650; border-radius: 6px; border: 0; }
.tbl.heatt { border-collapse: separate; border-spacing: 3px; }
/* Onglet Vidéos : prochaines publications automatiques */
.vlist { display: flex; flex-direction: column; gap: 10px; }
.vslot { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 14px; padding: 12px 14px; }
.vslot .when { font-weight: 700; font-size: 14px; line-height: 1.3; }
.vslot .when small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.vslot .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vslot .file { font-size: 11.5px; color: var(--muted); word-break: break-all; }
.vslot .cap { white-space: pre-wrap; font-size: 13.5px; margin: 8px 0 0; color: var(--ink); overflow-wrap: anywhere; }
.vslot .alerts { margin-top: 8px; }
.vslot .alert { padding: 7px 10px; font-size: 13px; }
.vslot.off { opacity: .7; }
.vslot video { display: block; margin-top: 10px; width: 100%; max-width: 240px; aspect-ratio: 9 / 16; border-radius: 12px; background: #000; }
.vslot .vact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.vslot .vact .btn.ghost { font-size: 13px; padding: 6px 12px; min-height: 34px; }
.vslot .vact .btn.pub { background: var(--accent); color: #fff; }
.vslot .vact .btn:disabled { opacity: .5; cursor: default; }
.vseg { margin: 0 0 12px; }
.vseg button { font-size: 14px; padding: 7px 14px; }
details.bank { margin-bottom: 10px; }
details.bank summary { cursor: pointer; font-size: 14px; padding: 2px 0 6px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.brow .file { font-size: 11.5px; color: var(--muted); word-break: break-all; }
.brow .vact { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.brow .vact .btn.ghost { font-size: 13px; padding: 6px 10px; min-height: 34px; }
.brow .vact .btn.pub { background: var(--accent); color: #fff; }
.brow video { grid-column: 1 / -1; width: 100%; max-width: 240px; aspect-ratio: 9 / 16; border-radius: 12px; background: #000; }
.genf { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.genf select { border: 1px solid var(--border); background: var(--page); border-radius: 8px; padding: 5px 8px; }
@media (max-width: 560px) { .brow { grid-template-columns: minmax(0, 1fr); } .brow .vact { justify-content: flex-start; } }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
@media (max-width: 560px) { .vslot { grid-template-columns: minmax(0, 1fr); } }
.tbl tr.pick { cursor: pointer; } .tbl tr.pick:hover td { background: var(--surface-2); }
.tbl tr.pick.on td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.box { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--muted); vertical-align: -1px; margin-right: 6px; }
tr.on .box { background: var(--accent); border-color: var(--accent); }
.mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.mini > div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.mini small { display: block; font-size: 11.5px; color: var(--ink-2); }
.mini b { font-size: 19px; }
.fun { display: flex; flex-direction: column; gap: 9px; }
.fun .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.fun .bar { height: 18px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-top: 3px; }
.fun .bar div { height: 100%; border-radius: 5px; background: var(--s1); }
.fstep { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.fstep.low { color: var(--bad-ink); }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin: 6px 0 4px; }
.mk { font-size: 10.5px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.jrow { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.jrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 17px; width: 28px; height: 28px; border-radius: 6px; }
.xbtn:hover { background: var(--surface-2); }
.addm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.addm input[type=text] { flex: 1 1 150px; }
.cardbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.card-h .tools { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg.small button { padding: 3px 9px; font-size: 12px; }
.chart .mkl { font-size: 10px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .skel, .icon-btn.spin svg { animation: none; } }
</style>
</head>
<body>

<div id="login" class="login hide">
  <div class="card">
    <h1>GeoG HQ</h1>
    <p>Tableau de bord privé. Connecte-toi avec ton compte admin GeoG.</p>
    <form id="login-form">
      <input id="email" type="email" autocomplete="username" placeholder="E-mail" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
      <button class="btn" type="submit">Se connecter</button>
      <p id="login-err" class="err hide" style="margin-top:10px"></p>
    </form>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="bar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>

function json(t) { try { return JSON.parse(t ?? 'null'); } catch { return null; } }

// ─── Utilitaires ─────────────────────────────────────────────────────────────
function store(k, v) {

const fmt = (n, d = 0) => (n == null || Number.isNaN(n) ? '—' : new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }).format(n));
const compact = (n) => (n == null ? '—' : new Intl.NumberFormat('fr-FR', { notation: n >= 10000 ? 'compact' : 'standard', maximumFractionDigits: 1 }).format(n));
const pct = (x, d = 1) => (x == null ? '—' : `${fmt(x * 100, d)} %`);
const eur = (x) => (x == null ? '—' : new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: x < 10 ? 2 : 0 }).format(x));
const dm = (iso) => { const [, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}`; };

const fx = (k) => (String(k).length === 13 ? `${new Date(`${k}:00:00Z`).getHours()}h` : dm(k));

const unit = () => (S.days === 1 && !S.range ? 'heure' : 'jour');
const per = () => (S.range ? `${dm(S.range.from)} → ${dm(S.range.to)}` : S.days === 1 ? '24 h' : `${S.days} j`);
const region = (() => { try { return new Intl.DisplayNames(['fr'], { type: 'region' }); } catch { return null; } })();

function ago(iso) {

/** Variation vs période précédente : flèche + texte, jamais la couleur seule. */
function delta(cur, prev, { invert = false } = {}) {
  if (cur == null || prev == null || prev === 0) return '';
  const r = (cur - prev) / prev;
  const cls = Math.abs(r) < 0.02 ? 'flat' : (r > 0) !== invert ? 'up' : 'down';
  const arrow = Math.abs(r) < 0.02 ? '→' : r > 0 ? '▲' : '▼';
  return `<span class="delta ${cls}" title="vs ${per()} précédent(e)s">${arrow} ${fmt(Math.abs(r) * 100)} %</span>`;
}

// ─── Données ─────────────────────────────────────────────────────────────────
let client;
async function api(source, fresh = false) {
  // getSession() rafraîchit le jeton s'il a expiré (onglet resté ouvert).
  const { data: { session } } = await client.auth.getSession();
  if (session) S.token = session.access_token;
  // Dates perso : toutes les sources ; pays et plateforme : PostHog seulement.
  const q = FILTERED.has(source) ? filterQuery() : S.range ? `&from=${S.range.from}&to=${S.range.to}` : '';
  const r = await fetch(`/api/hq?source=${source}&days=${daysParam()}${q}${fresh ? '&fresh=1' : ''}`, {
    headers: { authorization: `Bearer ${S.token}` },
  });
  if (r.status === 403) throw Object.assign(new Error('forbidden'), { forbidden: true });
  return r.json();
}

/** Dates perso : envoyées à part (from / to) ; days ne sert plus qu'au cache. */
function daysParam() {
  if (!S.range) return S.days;
  const n = Math.round((Date.parse(S.range.to) - Date.parse(S.range.from)) / 86400000) + 1;
  return [7, 28, 90].find((d) => d >= n) ?? 90;
}
function filterQuery() {
  let q = '';
  if (S.countries.length) q += `&countries=${S.countries.join(',')}${S.exclude ? '&exclude=1' : ''}`;
  if (S.platform !== 'all') q += `&platform=${S.platform}`;
  if (S.range) q += `&from=${S.range.from}&to=${S.range.to}`;
  return q;
}
const cacheKey = () => `hq.cache.${S.days}${filterQuery()}`;

async function loadAll(fresh = false, only = SOURCES) {
  $('#refresh').classList.add('spin');
  await Promise.all(only.map(async (src) => {
    S.pending.add(src);
    try {
      S.data[src] = await api(src, fresh);
    } catch (e) {
      if (e.forbidden) return forbidden();
      S.data[src] = { error: e.message };
    } finally {
      S.pending.delete(src);
      scheduleRender();
    }
  }));
  $('#refresh').classList.remove('spin');
  try {
    // Une entrée par combinaison de filtres : on ne garde que la courante.
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k?.startsWith('hq.cache.') && k !== cacheKey()) localStorage.removeItem(k);
    }
    localStorage.setItem(cacheKey(), JSON.stringify(S.data));
  } catch {}
}

function restoreCache() {
  try {
    const c = JSON.parse(localStorage.getItem(cacheKey()) ?? 'null');
    if (c) S.data = c;
  } catch {}
}

/** Résultat d'une sous-requête : { ok, v } ou { html } (squelette / erreur / à connecter). */
function part(src, key) {
  const res = S.data[src];
  if (!res) return { html: '<div class="skel"></div>' };
  if (res.notConfigured) return { html: setupHtml(src, res.missing, res.help) };
  if (res.error) return { html: errHtml(res.error) };
  const v = key ? res.data?.[key] : res.data;
  if (v !== undefined) return { ok: true, v };
  const err = res.data?._errors?.[key];
  if (err) return { html: errHtml(err) };
  if (res.data?._missing) return { html: setupHtml(src, res.data._missing) };
  return { html: '<div class="empty">Pas de données.</div>' };
}
/** Erreur courte ; une API Google non activée devient un lien d'activation. */
function errHtml(msg) {
  const m = String(msg);
  const link = m.match(/https:\/\/console\.developers\.google\.com\/apis\/api\/[^\s]+/);
  if (link) {
    const api = link[0].match(/api\/([^/]+)\//)?.[1] ?? 'API Google';
    return `<div class="setup">API à activer : <a href="${esc(link[0])}" target="_blank" rel="noopener">${esc(api)} ↗</a></div>`;
  }
  if (/PERMISSION_DENIED|403|does not have|insufficient/i.test(m)) {
    return `<div class="err" title="${esc(m)}">Accès refusé — ${esc(m.replace(/^\d{3} [^ ]+ — /, '').slice(0, 140))}</div>`;
  }

}

}

// ─── Composants ──────────────────────────────────────────────────────────────
const charts = [];

function tile(label, src, key, f) {
  const p = part(src, key);

    body = !res ? '<div class="skel"></div>' : `<div class="val muted">—</div><div class="sub">${res.notConfigured || res.data?._missing ? 'à connecter' : 'indisponible'}</div>`;

function hlist(rows, { label = (r) => r.label, value = (r) => r.value, show = (r) => fmt(value(r)), color = 'var(--s1)', limit = 10 } = {}) {
  const list = (rows ?? []).slice(0, limit);
  if (!list.length) return '<div class="empty">Rien sur la période.</div>';
  const max = Math.max(...list.map(value), 1);
  return `<div class="hlist">${list.map((r) => `
    <div class="hrow"><span class="name" title="${esc(label(r))}">${esc(label(r))}</span><span class="v num">${show(r)}</span>
    <div class="track"><div class="fill" style="width:${(value(r) / max) * 100}%;background:${color}"></div></div></div>`).join('')}</div>`;
}

function table(cols, rows, { limit = 20 } = {}) {
  if (!rows?.length) return '<div class="empty">Rien sur la période.</div>';
  return `<div class="scroll-x"><table class="tbl"><thead><tr>${cols.map((c) => `<th class="${c.r ? 'r' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows
    .slice(0, limit)

/**

function chart(series, { type = 'line', fmtY = (v) => fmt(v), height = 170, yMax, stacked = false, prev = null, marks = [], name = 'graphique' } = {}) {
  series = series.filter((s) => s.points?.length);

    ? `<div class="legend">${all.map((s) => `<span>${s.dashed ? '<i style="background:none;border-top:2px dashed var(--ink-2);height:0;width:14px;border-radius:0"></i>' : `<i style="background:${s.color}"></i>`}${esc(s.name)} <b class="num">${fmtY(sum(s.points, (p) => p.y))}</b></span>`).join('')}</div>`
    : '';
  const xs = series[0].points.map((p) => p.x);
  const head = [S.days === 1 && !S.range ? 'Heure' : 'Jour', ...all.map((s) => s.name)];
  const rows = xs.map((x, i) => [x, ...all.map((s) => s.points[i]?.y ?? '')]);
  CSV[id] = { name, head, rows };
  const tv = `<details class="tv"><summary>Voir le tableau · <button class="cardbtn" type="button" data-act="csv" data-id="${id}">CSV</button></summary><div class="scroll-x"><table class="tbl"><thead><tr>${head
    .map((h, k) => `<th class="${k ? 'r' : ''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${xs
    .map((x, i) => `<tr><td>${fx(x)}</td>${all.map((s) => `<td class="r num">${fmtY(s.points[i]?.y)}</td>`).join('')}</tr>`)
    .reverse().join('')}</tbody></table></div></details>`;
  return `${legend}<div class="chart" id="${id}" style="height:${height}px"></div>${tv}`;
}

/** Export CSV (séparateur « ; » et virgule décimale : s'ouvre tel quel dans Excel / Numbers en français). */
const CSV = {};
function downloadCsv({ name, head, rows }) {
  const cell = (v) => {
    const t = typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? '');
    return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const txt = '\ufeff' + [head, ...rows].map((r) => r.map(cell).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = `geog-hq-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function mountCharts() {
  for (const c of charts.splice(0)) {
    const el = document.getElementById(c.id);
    if (el) drawChart(el, c);
  }
}

function drawChart(el, { series, type, fmtY, height, yMax, stacked, prev, marks = [] }) {
  const W = el.clientWidth || 300;
  const H = height;
  const m = { l: 38, r: 6, t: 8, b: 20 };
  const iw = W - m.l - m.r;
  const ih = H - m.t - m.b;
  const n = series[0].points.length;
  const stack = type === 'bar' && stacked && series.length > 1;
  const totals = stack ? series[0].points.map((_, i) => sum(series, (s) => s.points[i]?.y)) : [];
  const all = [...(stack ? totals : series.flatMap((s) => s.points.map((p) => p.y))), ...(prev ? prev.points.map((p) => p.y) : [])].filter((y) => y != null);
  const max = yMax ?? niceMax(Math.max(...all, 0));
  const X = (i) => m.l + (type === 'bar' ? (i + 0.5) * (iw / n) : n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => m.t + ih - (v / max) * ih;
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = (max / 3) * k;
    g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`;
    g += `<text class="axis num" x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${compactY(v, fmtY)}</text>`;
  }
  const xs = series[0].points.map((p) => p.x);
  const ticks = n <= 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
  for (const i of ticks) g += `<text class="axis" x="${X(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${fx(xs[i])}</text>`;

  if (type === 'bar') {
    const bw = Math.max(2, iw / n - 2); // 2 px d'écart entre barres
    const layers = stack ? series : [series[0]];
    for (let i = 0; i < n; i++) {
      let base = 0;
      layers.forEach((s, k) => {
        const v = s.points[i]?.y;
        if (!v) return;
        const h = Math.max(1, (v / max) * ih);
        const x = X(i) - bw / 2;
        const y = m.t + ih - (base / max) * ih - h;
        const isTop = k === layers.length - 1 || !layers.slice(k + 1).some((t) => t.points[i]?.y);
        const r = isTop ? Math.min(4, bw / 2, h) : 0;
        g += `<path fill="${s.color}" d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y + h}Z"/>`;
        base += v;
      });
    }
  } else {
    for (const s of series) {
      let d = '';
      let pen = false;
      s.points.forEach((p, i) => {
        if (p.y == null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`;
        pen = true;
      });
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  if (prev) {
    let d = '';
    let pen = false;
    prev.points.forEach((p, i) => {
      if (p.y == null) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`;
      pen = true;
    });
    g += `<path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  }
  marks.forEach((mk, k) => {
    const x = X(mk.i);
    g += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}" stroke="${mk.color}" stroke-width="1.5" stroke-dasharray="3 3"><title>${esc(mk.label)}</title></line>`;
    const right = x > W * 0.75;
    g += `<text class="mkl" x="${x + (right ? -4 : 4)}" y="${m.t + 9 + (k % 3) * 12}" fill="${mk.color}" text-anchor="${right ? 'end' : 'start'}">${esc(mk.label.length > 22 ? `${mk.label.slice(0, 21)}…` : mk.label)}</text>`;
  });
  g += `<g class="hover" style="display:none"><line x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3"/>${
    type === 'line' ? series.map((s) => `<circle r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('') : ''}</g>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map((s) => s.name).join(', '))}">${g}<rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;

  const svg = el.querySelector('svg');
  const hov = svg.querySelector('.hover');
  const tip = el.querySelector('.tip');
  const move = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = type === 'bar'
      ? Math.min(n - 1, Math.max(0, Math.floor((px - m.l) / (iw / n))))
      : Math.min(n - 1, Math.max(0, Math.round(((px - m.l) / iw) * (n - 1))));
    const x = X(i);
    hov.style.display = '';
    hov.querySelector('line').setAttribute('x1', x);
    hov.querySelector('line').setAttribute('x2', x);
    hov.querySelectorAll('circle').forEach((c, k) => {
      const y = series[k].points[i]?.y;
      c.style.display = y == null ? 'none' : '';
      if (y != null) { c.setAttribute('cx', x); c.setAttribute('cy', Y(y)); }
    });
    const rowsT = series.map((s) => `${series.length > 1 ? `<i style="background:${s.color}"></i>${esc(s.name)} ` : ''}<b class="num">${fmtY(s.points[i]?.y)}</b>`);
    if (stack) rowsT.push(`Total <b class="num">${fmtY(totals[i])}</b>`);
    if (prev) rowsT.push(`<span style="opacity:.75">${esc(prev.name)}</span> <b class="num">${fmtY(prev.points[i]?.y)}</b>`);
    marks.filter((mk) => mk.i === i).forEach((mk) => rowsT.push(`<i style="background:${mk.color}"></i>${esc(mk.label)}`));
    tip.innerHTML = `<b>${fx(xs[i])}</b><br>${rowsT.join('<br>')}`;
    tip.style.opacity = 1;
    const tx = (x / W) * rect.width;
    tip.style.left = `${Math.min(Math.max(tx - tip.offsetWidth / 2, 0), rect.width - tip.offsetWidth)}px`;
    tip.style.top = `${-tip.offsetHeight - 6}px`;
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { hov.style.display = 'none'; tip.style.opacity = 0; });
}
const compactY = (v, f) => (v >= 1000 ? new Intl.NumberFormat('fr-FR', { notation: 'compact', maximumFractionDigits: 1 }).format(v) : f(v));

function alerts() {
  const a = [];
  const health = val('deploys', 'health', (v) => v);
  health?.filter((h) => !h.ok).forEach((h) => a.push(['bad', '!', `Site injoignable : ${h.url}`, `HTTP ${h.status || 'timeout'}`]));
  const unres = val('sentry', 'unresolved', (v) => v);
  if (unres?.last24h) a.push(['bad', '!', `${unres.last24h} nouvelle(s) erreur(s) Sentry en 24 h`, 'Onglet Qualité']);
  const cf = val('sentry', 'crashFree', (v) => v.session);
  if (cf != null && cf < 0.99) a.push(['warn', '!', `Sessions sans crash : ${pct(cf, 2)}`, 'Objectif ≥ 99,5 %']);
  const cron = val('supabase', 'ops', (v) => v.cronFailures);
  const recentCron = cron?.filter((c) => Date.now() - new Date(c.created_at) < 7 * 86400000);
  if (recentCron?.length) a.push(['warn', '!', `${recentCron.length} échec(s) de cron sur 7 j`, recentCron[0].job]);
  val('adsense', 'alerts', (v) => v)?.forEach((x) => a.push([x.severity === 'SEVERE' ? 'bad' : 'warn', '!', `AdSense : ${x.message}`, x.type]));
  const acc = val('adsense', 'account', (v) => v);
  if (acc && acc.state && acc.state !== 'READY') a.push(['warn', '!', `Compte AdSense : ${acc.state}`, acc.pendingTasks.join(', ')]);
  val('searchconsole', 'sitemaps', (v) => v)?.filter((s) => s.errors).forEach((s) => a.push(['warn', '!', `Sitemap en erreur : ${s.path}`, `${s.errors} erreur(s)`]));
  const pushes = val('supabase', 'ops', (v) => v.recentPushes);
  if (pushes && pushes[0] && Date.now() - new Date(pushes[0].created_at) > 36 * 3600000) a.push(['warn', '!', 'Aucun push envoyé depuis plus de 36 h', `dernier ${ago(pushes[0].created_at)}`]);
  const bad = val('play', 'reviews', (v) => v)?.filter((r) => r.rating <= 2 && Date.now() - new Date(r.date) < 7 * 86400000);
  if (bad?.length) a.push(['warn', '!', `${bad.length} avis Play ≤ 2★ cette semaine`, 'Onglet Acquisition']);
  const vids = val('social', 'slots', (v) => v.filter((x) => x.warnings?.length || x.skipped).length);
  if (vids) a.push(['warn', '!', `${vids} point(s) à vérifier dans les prochaines vidéos`, 'Onglet Vidéos']);
  if (!a.length && Object.keys(S.data).length >= SOURCES.length - 1) a.push(['good', '✓', 'Rien à signaler', 'Sur les sources connectées : site en ligne, pas de nouvelle erreur, crons OK']);
  return a.length
    ? `<div class="alerts">${a.map(([c, i, t, s]) => `<div class="alert ${c}"><span class="dot">${i}</span><div>${esc(t)}<small>${esc(s ?? '')}</small></div></div>`).join('')}</div>`
    : '<div class="skel" style="height:48px"></div>';
}

// Types de pub AdMob pour le filtre de l'onglet Revenus. L'API renvoie la valeur brute
// FORMAT en minuscules (« interstitial », « banner »…) : on compare sans tenir compte de la casse.
const AD_FORMATS = [
  ['all', 'Toutes'],
  ['interstitial', 'Interstitiel'],
  ['banner', 'Bannière'],
  ['rewarded', 'Récompensée'],
];
const adFmt = (r) => String(r.FORMAT_ID ?? r.FORMAT ?? '').toLowerCase();
/** byDayFormat filtré sur S.adFormat puis remis à une ligne par jour. */
function adDays(v) {
  const want = S.adFormat.toLowerCase();
  const rows = want === 'all' ? v : v.filter((r) => adFmt(r) === want);
  const days = {};
  for (const r of rows) {
    const d = (days[r.x] ??= { x: r.x, earnings: 0, impressions: 0, requests: 0, clicks: 0 });
    d.earnings += r.earnings; d.impressions += r.impressions; d.requests += r.requests; d.clicks += r.clicks;
  }
  return Object.values(days).sort((a, b) => a.x.localeCompare(b.x));
}

// ─── Vidéos : prochaines publications automatiques (social-post.yml) ───────
const PLATFORM_NAMES = { tiktok: 'TikTok', instagram: 'Instagram', youtube: 'YouTube', facebook: 'Facebook', threads: 'Threads', x: 'X', twitter: 'X', linkedin: 'LinkedIn' };
const platformName = (p) => PLATFORM_NAMES[p] ?? p;
// Créneaux calés sur l'heure de Paris : affichés à l'heure de Paris, où que soit le navigateur.
const parisDay = (d) => d.toLocaleDateString('fr-CA', { timeZone: 'Europe/Paris' }); // YYYY-MM-DD
const parisTime = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
function slotWhen(iso) {
  const d = new Date(iso);
  const day = Math.round((Date.parse(parisDay(d)) - Date.parse(parisDay(new Date()))) / 86400000);
  const label = day === 0 ? 'Aujourd’hui' : day === 1 ? 'Demain' : d.toLocaleDateString('fr-FR', { weekday: 'long', timeZone: 'Europe/Paris' }).replace(/^./, (c) => c.toUpperCase());
  return `${parisTime(d)}<small>${label} ${dm(parisDay(d))}</small>`;
}
function previewHtml(it) {
  if (!it.previewUrl) return '';
  if (!S.previews[it.key]) return '';
  // Relayé par /api/hq en video/mp4 : Safari (iPhone) refuse le lien GitHub direct.
  return `<video controls playsinline preload="metadata" src="${esc(it.previewUrl)}"></video>`;
}
function slotHtml(x) {
  const where = (x.platforms ?? (x.target === 'youtube' ? ['youtube'] : [])).map((p) => `<span class="pill">${esc(platformName(p))}</span>`).join('');
  if (x.skipped) {
    return `<section class="card vslot off"><div class="when">${slotWhen(x.at)}</div><div><div class="meta">${where}</div>
      <div class="alerts"><div class="alert warn"><span class="dot">!</span><div>${esc(x.skipped)}</div></div></div></div></section>`;
  }
  const it = x.item;
  const busy = S.vbusy ? 'disabled' : '';
  const fmtPill = `<span class="pill ${it.format.kind === 'next' ? 'good' : ''}">${esc(it.format.label)}</span>`;
  const warns = x.warnings?.length
    ? `<div class="alerts">${x.warnings.map((w) => `<div class="alert warn"><span class="dot">!</span><div>${esc(w)}</div></div>`).join('')}</div>`
    : '';
  return `<section class="card vslot"><div class="when">${slotWhen(x.at)}</div><div>
    <div class="meta">${where}${fmtPill}${it.pinned ? '<span class="pill">📌 ordre manuel</span>' : ''}</div>
    <div class="file">${esc(it.key)}${it.size ? ` · ${fmt(it.size / 1e6, 1)} Mo` : ''}</div>
    ${it.caption ? `<p class="cap">${esc(it.caption)}</p>` : '<p class="cap muted">(pas de légende)</p>'}
    ${warns}
    <div class="vact">
      ${it.previewUrl ? `<button class="btn ghost" type="button" data-act="vprev" data-key="${esc(it.key)}">${S.previews[it.key] ? '✕ Fermer' : '▶ Voir'}</button>` : ''}
      ${x.target === 'social' ? `
      <button class="btn ghost" type="button" data-act="vmove" data-dir="-1" data-key="${esc(it.key)}" aria-label="Avancer" ${busy}>↑</button>
      <button class="btn ghost" type="button" data-act="vmove" data-dir="1" data-key="${esc(it.key)}" aria-label="Reculer" ${busy}>↓</button>
      <button class="btn ghost pub" type="button" data-act="vpub" data-key="${esc(it.key)}" ${busy}>Publier maintenant</button>` : ''}
      <button class="btn ghost" type="button" data-act="vskip" data-key="${esc(it.key)}" ${busy}>Retirer</button>
    </div>
    ${previewHtml(it)}
  </div></section>`;
}
function videosView() {
  const src = 'social';
  const head = block(src, 'settings', (v) => {
    const bits = [
      v.enabled === false ? '<span class="pill bad">Publication coupée (SOCIAL_POST_ENABLED = false)</span>' : v.enabled ? '<span class="pill good">● Publication active</span>' : '',
      `Langues : ${esc(v.langs.join(', '))}`,
      `Tournages ≥ shorts-${v.minRelease}`,
    ].filter(Boolean);
    return `<p class="muted" style="font-size:13px;margin:0 2px 10px">${bits.join(' · ')}<br>Simulation du choix du script de publication, à partir des vidéos déjà tournées. Le tournage de 5 h ajoute chaque jour de nouvelles vidéos : les créneaux lointains peuvent encore changer.${v.varsRead ? '' : ' Réglages du dépôt non lus : valeurs par défaut.'}</p>`;
  });
  const res = S.data[src]?.data;
  const notes = [
    S.vmsg ? `<div class="alert ${S.vmsg.kind}"><span class="dot">${S.vmsg.kind === 'good' ? '✓' : '!'}</span><div>${esc(S.vmsg.text)}</div></div>` : '',
    res?.running?.length ? `<div class="alert warn"><span class="dot">…</span><div>Publication en cours sur GitHub<small><a href="${esc(res.running[0].url)}" target="_blank" rel="noopener">Suivre ↗</a></small></div></div>` : '',
    res?.pinned?.length ? `<div class="alert"><span class="dot" style="background:var(--muted)">📌</span><div>Ordre choisi à la main pour ${res.pinned.length} vidéo(s)<small><button class="linkbtn" type="button" data-act="vreset" ${S.vbusy ? 'disabled' : ''}>Revenir à l'ordre automatique</button></small></div></div>` : '',
  ].join('');
  const slots = block(src, 'slots', (v) => {
    if (!v.length) return '<div class="empty">Aucun créneau sur les 7 prochains jours.</div>';
    const n = v.filter((x) => x.warnings?.length || x.skipped).length;
    const sum = n
      ? `<div class="alerts" style="margin-bottom:10px"><div class="alert warn"><span class="dot">!</span><div>${n} créneau(x) à vérifier<small>Détail sous chaque vidéo</small></div></div></div>`
      : '<div class="alerts" style="margin-bottom:10px"><div class="alert good"><span class="dot">✓</span><div>Aucun doublon ni oubli repéré<small>Sur les 7 prochains jours</small></div></div></div>';
    return `${sum}<div class="vlist">${v.map(slotHtml).join('')}</div>`;
  });
  const hist = card('Dernières publications', src, block(src, 'history', (v) => table([
    { h: 'Quand', f: (r) => `${dm(parisDay(new Date(r.at)))} ${parisTime(new Date(r.at))}` },
    { h: 'Vidéo', wrap: 1, f: (r) => `${esc(r.format.label)} <span class="muted">${esc(r.key)}</span>` },
    { h: 'Où', f: (r) => esc(r.platforms.map(platformName).join(', ')) },
    { h: 'Légende', wrap: 1, f: (r) => esc((r.caption ?? '').split('\n')[0]) },
  ], v)));
  const seg = `<div class="seg vseg" role="group" aria-label="Vidéos">${[['next', 'À venir'], ['bank', 'Banque'], ['gen', 'Tournage']]
    .map(([k, l]) => `<button type="button" data-act="vtab" data-v="${k}" aria-pressed="${S.vtab === k}">${l}</button>`).join('')}</div>`;
  const top = `${seg}${notes ? `<div class="alerts" style="margin-bottom:10px">${notes}</div>` : ''}`;
  if (S.vtab === 'bank') return `${top}${bankView()}`;
  if (S.vtab === 'gen') return `${top}${genView()}`;
  return `${top}
  <h2 class="section">Prochaines vidéos publiées</h2>
  ${head}
  ${slots}
  <h2 class="section">Déjà publié</h2>
  ${hist}`;
}

/** Écritures de l'onglet Vidéos (ordre, publication) : POST /api/hq, puis on recharge la file. */
async function videoWrite(source, body, okText) {
  S.vbusy = source;
  S.vmsg = null;
  render();
  try {
    const { data: { session } } = await client.auth.getSession();
    if (session) S.token = session.access_token;
    const r = await fetch(`/api/hq?source=${source}`, {
      method: 'POST',
      headers: { authorization: `Bearer ${S.token}`, 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    S.vmsg = r.ok && j.ok ? { kind: 'good', text: okText } : { kind: 'bad', text: j.error ?? `Erreur ${r.status}` };
  } catch (e) {
    S.vmsg = { kind: 'bad', text: e.message };
  }
  S.vbusy = null;
  await loadAll(true, ['social']);
}
/** ↑ / ↓ : on échange avec la voisine, et l'ordre affiché jusque-là devient l'ordre manuel. */
function moveVideo(key, dir) {
  const list = (S.data.social?.data?.slots ?? []).filter((x) => x.target === 'social' && x.item).map((x) => x.item.key);
  const i = list.indexOf(key);
  const k = i + dir;
  if (i < 0 || k < 0 || k >= list.length) return;
  [list[i], list[k]] = [list[k], list[i]];
  videoWrite('social-order', { pinned: list.slice(0, Math.max(i, k) + 1) }, 'Ordre enregistré : le script de publication le suit dès le prochain créneau.');
}
function skipVideo(key) {
  if (confirm(`Retirer cette vidéo ? Elle ne sera publiée nulle part.\n\n${key}\n\nTu pourras la remettre depuis la banque.`)) {
    videoWrite('social-order', { skip: key }, 'Vidéo retirée : la suivante prend sa place.');
  }
}
function publishVideo(key) {
  const ok = confirm(`Publier maintenant sur TikTok et Instagram ?\n\n${key}\n\nElle part dans 1 à 2 minutes. Le créneau automatique suivant est sauté s'il tombe dans les 3 h.`);
  if (ok) videoWrite('social-publish', { key }, 'Publication lancée : la vidéo part dans 1 à 2 minutes.');
}

const countryName = (c) => country(c);
const samePick = (list, ex) => ex === S.exclude && list.length === S.countries.length && list.every((c) => S.countries.includes(c));
const today = () => new Date().toISOString().slice(0, 10);
const shiftDay = (iso, k) => new Date(Date.parse(`${iso}T00:00:00Z`) + k * 86400000).toISOString().slice(0, 10);

/** Liste de pays proposés : ceux de la carte et ceux vus dans les données, triés par nom. */
function countryOptions() {
  const codes = new Set([...Object.keys(S.world ?? {}), ...(val('growth', 'countries', (v) => v.map((r) => r.c)) ?? [])]);
  return [...codes].filter((c) => /^[A-Z]{2}$/.test(c)).map((c) => [c, countryName(c)]).sort((a, b) => a[1].localeCompare(b[1], 'fr'));
}
function scopeLabel() {
  const p = PRESETS.find(([, list, ex]) => samePick(list, ex));
  const geo = p ? p[0] : S.countries.length === 1 ? countryName(S.countries[0]) : `${S.countries.length} pays`;
  return `${geo}${S.platform === 'all' ? '' : ` · ${PLATFORMS.find((x) => x[0] === S.platform)[1]}`}`;
}
function filterCount() {
  return (S.countries.length ? 1 : 0) + (S.platform !== 'all' ? 1 : 0) + (S.range ? 1 : 0);
}

function setFilters(patch) {
  Object.assign(S, patch);
  store('hq.platform', S.platform);
  store('hq.countries', JSON.stringify(S.countries));
  store('hq.exclude', S.exclude ? '1' : '0');
  store('hq.range', JSON.stringify(S.range));
  store('hq.compare', S.compare ? '1' : '0');
  if (!('compare' in patch && Object.keys(patch).length === 1)) {
    const keep = Object.fromEntries(Object.entries(S.data).filter(([k]) => !FILTERED.has(k)));
    S.data = keep;
    if ('range' in patch) S.data = {}; // la période change pour toutes les sources
    restoreCacheMerge();
    loadAll(false, 'range' in patch ? SOURCES : [...FILTERED]);
  }
  render();
}
function restoreCacheMerge() {
  let c = null;
  try { c = json(localStorage.getItem(cacheKey())); } catch {}
  if (c) for (const [k, v] of Object.entries(c)) S.data[k] ??= v;
}
function toggleCountry(c) {
  const list = S.exclude ? [] : [...S.countries];
  const i = list.indexOf(c);
  if (i >= 0) list.splice(i, 1); else list.push(c);
  setFilters({ countries: list, exclude: false });
}

// ─── Croissance ──────────────────────────────────────────────────────────────
const SCALE = ['#dce8f7', '#b5cfee', '#86b0e3', '#5590d6', '#2f72c4', '#1b55a0'];
const sumA = (a) => (a ?? []).reduce((s, v) => s + (Number(v) || 0), 0);

/** Mini-courbe d'une tuile : période en trait plein, précédente en pointillé. */
function spark(cur, prev, color = 'var(--s1)') {
  if (!cur?.length || cur.length < 2) return '';
  const vals = [...cur, ...(S.compare && prev ? prev : [])].filter((v) => v != null);
  const mx = Math.max(...vals, 1e-9);
  const path = (a) => 'M' + a.map((v, i) => `${((i / (a.length - 1)) * 100).toFixed(1)} ${(27 - ((v ?? 0) / mx) * 25).toFixed(1)}`).join(' L');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">${S.compare && prev?.length === cur.length ? `<path d="${path(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}<path d="${path(cur)} L100 28 L0 28 Z" fill="${color}" opacity=".12"/><path d="${path(cur)}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function gtile(label, src, ready, f) {
  if (!ready) return tile(label, src, '__none__', () => ({}));
  const { value, sub = '', cur, prev, color } = f();
  return `<div class="tile"><div class="lbl">${esc(label)}</div><div class="val num">${value}</div><div class="sub">${sub}</div>${spark(cur, prev, color)}</div>`;
}

/** Téléchargements par seau : séries affichées selon la plateforme et la source choisie. */
function downloads() {
  const inst = val('growth', 'installs', (v) => v);
  const W = val('growth', 'window', (v) => v);
  if (!inst || !W) return null;
  const xs = W.buckets;
  const official = { iOS: val('growth', 'appstore', (v) => v), Android: val('growth', 'play', (v) => v) };
  const hasOfficial = !W.hourly && (official.iOS?.length || official.Android?.length);
  const useStores = hasOfficial && S.dlSource === 'stores';
  const plats = S.platform === 'all' ? ['iOS', 'Android'] : [{ ios: 'iOS', android: 'Android', web: 'Web' }[S.platform]];
  const notes = [];
  const series = plats.map((p) => {
    let ys = inst.cur[p];
    if (useStores && p !== 'Web') {
      const o = official[p];
      if (o?.length) {
        const m = Object.fromEntries(o.map((r) => [r.x, r.y]));
        ys = xs.map((x) => m[x] ?? null);
      } else notes.push(`${p} : chiffres officiels indisponibles, premières ouvertures PostHog`);
    }
    return { name: p === 'Web' ? 'Nouveaux visiteurs web' : p, color: PLAT_COLOR[p], points: xs.map((x, i) => ({ x, y: ys[i] })) };
  });
  // Période précédente : seulement en premières ouvertures (pas de stores officiels pour elle).
  const prevY = useStores ? null : xs.map((_, i) => sumA(plats.map((p) => inst.prev[p][i])));
  const tot = xs.map((_, i) => sumA(series.map((s) => s.points[i].y)));
  return { xs, series, prev: prevY && { name: 'Période précédente', points: xs.map((x, i) => ({ x, y: prevY[i] })) }, tot, prevTot: prevY, hasOfficial, useStores, notes, web: S.platform === 'web' };
}

function markersIn(xs) {
  const list = val('growth', 'markers', (v) => v.list) ?? [];
  if (!xs?.length || String(xs[0]).length !== 10) return [];
  return list
    .map((mk) => ({ ...mk, i: xs.indexOf(mk.day), color: (MARK[mk.kind] ?? MARK.autre)[1] }))
    .filter((mk) => mk.i >= 0);
}

function growthView() {
  const g = 'growth';
  const D = downloads();
  const ser = val(g, 'series', (v) => v);
  const eng = val(g, 'engagement', (v) => v);
  const coh = val(g, 'cohort', (v) => v);
  const rev = val(g, 'revenue', (v) => v);
  const W = val(g, 'window', (v) => v);
  const cohTot = cohortTotals();
  const personDays = eng?.personDays;
  const revTotal = rev ? (rev.admob ?? 0) + (rev.adsense ?? 0) : null;
  const prevPersonDays = ser ? sumA(ser.prev.active) : null;
  const dlLabel = D?.web ? 'Nouveaux visiteurs web' : 'Téléchargements';
  const dSub = (cur, prev) => (S.compare ? `${delta(cur, prev)} <span>vs ${fmt(prev)}</span>` : '');
  const marks = D ? markersIn(D.xs) : [];

  const tiles = `
  <div class="kpis">
    ${gtile(dlLabel, g, !!D, () => ({ value: fmt(sumA(D.tot)), sub: D.prevTot ? dSub(sumA(D.tot), sumA(D.prevTot)) : 'stores officiels', cur: D.tot, prev: D.prevTot }))}
    ${gtile('Actifs par jour (moy.)', g, !!ser, () => ({ value: fmt(sumA(ser.cur.active) / ser.cur.active.length), sub: dSub(sumA(ser.cur.active), sumA(ser.prev.active)), cur: ser.cur.active, prev: ser.prev.active }))}
    ${gtile('Inscriptions (PostHog)', g, !!ser, () => ({ value: fmt(sumA(ser.cur.signups)), sub: dSub(sumA(ser.cur.signups), sumA(ser.prev.signups)), cur: ser.cur.signups, prev: ser.prev.signups, color: '#7c5cd6' }))}
    ${gtile('Rétention J1', g, !!cohTot, () => ({ value: pct(ratio(cohTot.r1, cohTot.e1), 0), sub: `J7 ${pct(ratio(cohTot.r7, cohTot.e7), 0)} · ${fmt(cohTot.n)} nouveaux` }))}
    ${gtile('Parties par joueur', g, !!(ser && eng), () => ({ value: fmt(ratio(eng.games, personDays), 1), sub: 'par jour actif', cur: ser.cur.games.map((v, i) => ratio(v, ser.cur.active[i]) ?? 0), prev: ser.prev.games.map((v, i) => ratio(v, ser.prev.active[i]) ?? 0), color: '#a16207' }))}
    ${rev ? gtile('Revenu par actif / jour', g, !!(rev && eng), () => {
      const cur = revTotal / (personDays || 1);
      const prevV = prevPersonDays ? rev.prev / prevPersonDays : null;
      const byDay = Object.fromEntries((rev.byDay ?? []).map((r) => [r.x, r.admob + r.adsense]));
      return { value: new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 4 }).format(cur), sub: S.compare && prevV ? `${delta(cur, prevV)} ${eur(revTotal)} au total` : `${eur(revTotal)} au total`, cur: ser && W && !W.hourly ? W.buckets.map((x, i) => ratio(byDay[x] ?? 0, ser.cur.active[i]) ?? 0) : null, color: '#0f8a5f' };
    }) : tile('Revenu par actif / jour', g, 'revenue', () => ({}))}
  </div>`;

  const srcSeg = D?.hasOfficial
    ? `<div class="seg small" role="group" aria-label="Mesure">${[['posthog', 'Premières ouvertures'], ['stores', 'Stores officiels']].map(([v, l]) => `<button data-act="dlsrc" data-v="${v}" aria-pressed="${S.dlSource === v}">${l}</button>`).join('')}</div>`
    : '';
  const dlCard = card(`${D?.web ? 'Nouveaux visiteurs web' : 'Téléchargements'} par ${unit()}${S.platform === 'all' ? ' et par plateforme' : ''}`, g,
    D ? `${chart(D.series, { type: 'bar', stacked: true, prev: D.prev, marks, height: 230, name: 'telechargements' })}
         <p class="muted" style="font-size:12px;margin:6px 0 0">${D.useStores ? 'App Store Connect et Google Play (chiffres officiels, ~1 à 2 jours de retard).' : D.web ? 'Personnes dont la toute première visite du site tombe ce jour-là.' : 'Premières ouvertures de l’app (PostHog), au plus près des téléchargements, sans délai.'} ${esc(scopeLabel())}${D.notes.length ? ` · ${esc(D.notes.join(' · '))}` : ''}</p>`
      : part(g, 'installs').html ?? '<div class="skel"></div>',
    { tools: srcSeg });

  return `
  <h2 class="section">Croissance · ${esc(scopeLabel())} · ${per()}</h2>
  ${tiles}
  <div class="grid" style="margin-top:12px">${dlCard}</div>
  <div class="grid two" style="margin-top:12px;align-items:start">
    ${mapCard()}
    ${rankingCard()}
  </div>
  <div class="grid two" style="margin-top:12px">
    ${card('Entonnoir des nouveaux joueurs', g, coh ? funnelHtml(cohTot) : part(g, 'cohort').html, { extra: 'PostHog' })}
    ${card('Engagement', g, eng && coh ? engagementHtml(eng, coh) : part(g, eng ? 'cohort' : 'engagement').html, { extra: 'PostHog' })}
  </div>
  <div class="grid two" style="margin-top:12px">
    ${card('Revenus par utilisateur', 'growth', rev ? revenueHtml(rev, revTotal, personDays, cohTot) : part(g, 'revenue').html, { extra: 'AdMob · AdSense' })}
    ${card('Repères et effet', g, journalHtml(D), { extra: 'PostHog · Supabase' })}
  </div>`;
}

const METRICS = [['installs', 'Nouveaux'], ['active', 'Actifs'], ['d1', 'Rétention J1'], ['revenue', 'Revenus']];
function countryStats() {
  const rows = val('growth', 'countries', (v) => v) ?? [];
  const coh = val('growth', 'cohort', (v) => v) ?? [];
  const rev = val('growth', 'revenue', (v) => v.byCountry) ?? [];
  const m = {};
  for (const r of rows) m[r.c] = { c: r.c, installs: r.installs, active: r.active };
  for (const r of coh) if (r.c) { const x = (m[r.c] ??= { c: r.c, installs: 0, active: 0 }); x.e1 = (x.e1 ?? 0) + r.e1; x.r1 = (x.r1 ?? 0) + r.r1; }
  for (const r of rev) (m[r.c] ??= { c: r.c, installs: 0, active: 0 }).revenue = r.earnings;
  for (const x of Object.values(m)) x.d1 = x.e1 >= 10 ? x.r1 / x.e1 : null;
  return m;
}
function mapCard() {
  if (!S.world) return card('Carte du monde', 'growth', '<div class="skel"></div>');
  const p = part('growth', 'countries');
  if (!p.ok) return card('Carte du monde', 'growth', p.html);
  const m = countryStats();
  const metric = S.mapMetric;
  const vals = Object.values(m).map((x) => x[metric]).filter((v) => v > 0);
  const max = Math.max(...vals, 1e-9);
  const lvl = (v) => (v == null || v <= 0 ? -1 : metric === 'd1' ? Math.min(5, Math.floor((v / 0.4) * 6)) : Math.min(5, Math.floor((Math.log1p(v) / Math.log1p(max)) * 5.999)));
  const show = (x) => (metric === 'd1' ? pct(x.d1, 0) : metric === 'revenue' ? eur(x.revenue) : fmt(x[metric]));
  const sel = new Set(S.exclude ? [] : S.countries);
  const paths = Object.entries(S.world).map(([c, d]) => {
    const x = m[c];
    const l = lvl(x?.[metric]);
    return `<path d="${d}" data-act="tog" data-c="${c}" fill="${l < 0 ? 'var(--grid)' : SCALE[l]}" class="${sel.has(c) ? 'on' : ''}"><title>${esc(countryName(c))}${x ? ` · ${show(x)}` : ''}</title></path>`;
  }).join('');
  const seg = `<div class="seg small" role="group" aria-label="Mesure de la carte">${METRICS.map(([v, l]) => `<button data-act="mapm" data-v="${v}" aria-pressed="${metric === v}">${l}</button>`).join('')}</div>`;
  return card('Carte du monde', 'growth', `<div class="map"><svg viewBox="0 0 576 250" role="img" aria-label="Carte : ${esc(METRICS.find((x) => x[0] === metric)[1])} par pays">${paths}</svg></div>
    <div class="scale"><span>Moins</span>${SCALE.map((c) => `<i style="background:${c}"></i>`).join('')}<span>Plus</span><span style="margin-left:auto">Clic = filtrer ce pays · contour = pays filtrés</span></div>`, { tools: seg });
}
function rankingCard() {
  const p = part('growth', 'countries');
  if (!p.ok) return card('Classement des pays', 'growth', p.html);
  const m = countryStats();
  const rows = Object.values(m).sort((a, b) => b.installs - a.installs || b.active - a.active).slice(0, 15);
  const sel = new Set(S.exclude ? [] : S.countries);
  const id = `t${++chartId}`;
  CSV[id] = { name: 'pays', head: ['Pays', 'Code', 'Nouveaux joueurs', 'Actifs', 'Rétention J1', 'Revenus €'], rows: Object.values(m).sort((a, b) => b.installs - a.installs).map((x) => [countryName(x.c), x.c, x.installs, x.active, x.d1 ?? '', x.revenue ?? '']) };
  const maxI = Math.max(...rows.map((r) => r.installs), 1);
  return card('Classement des pays', 'growth', `<div class="scroll-x"><table class="tbl"><thead><tr><th>Pays</th><th class="r">Nouveaux</th><th class="r">Actifs</th><th class="r">J1</th><th class="r">Revenus</th></tr></thead><tbody>${rows.map((x) => `
    <tr class="pick ${sel.has(x.c) ? 'on' : ''}" data-act="tog" data-c="${x.c}"><td><span class="box"></span>${esc(countryName(x.c))}</td>
    <td class="r num">${fmt(x.installs)}<div class="track" style="height:3px;background:var(--surface-2);border-radius:2px;margin-top:3px"><div style="height:100%;width:${(x.installs / maxI) * 100}%;background:var(--s1);border-radius:2px;margin-left:auto"></div></div></td>
    <td class="r num">${fmt(x.active)}</td><td class="r num">${pct(x.d1, 0)}</td><td class="r num">${x.revenue != null ? eur(x.revenue) : '—'}</td></tr>`).join('')}</tbody></table></div>`,
  { tools: `<button class="cardbtn" data-act="csv" data-id="${id}">CSV</button>` });
}

function funnelHtml(t) {
  if (!t?.n) return '<div class="empty">Aucun nouveau joueur sur la période.</div>';
  const steps = [['Nouveaux joueurs', t.n, t.n]];
  if (S.platform !== 'web') steps.push(['App installée (1re ouverture)', t.installed, t.n]);
  steps.push(['1re partie lancée', t.started, t.n], ['1re partie finie', t.completed, t.n], ['Compte créé', t.signed, t.n]);
  steps.push(['Revenu à J1', t.r1, t.e1, true], ['Revenu à J7', t.r7, t.e7, true]);
  const id = `t${++chartId}`;
  CSV[id] = { name: 'entonnoir', head: ['Étape', 'Joueurs', 'Base', 'Taux'], rows: steps.map(([l, v, b]) => [l, v, b, b ? v / b : '']) };
  return `<div class="fun">${steps.map(([label, v, base, isRet], i) => {
    const r = ratio(v, base);
    const prevR = i ? ratio(steps[i - 1][1], steps[i - 1][2]) : null;
    const step = i && r != null && prevR ? r / prevR : null;
    return `<div><div class="top"><span>${label}</span><span class="num"><b>${fmt(v)}</b> <span class="muted">· ${pct(r, 0)}${isRet ? ` de ${fmt(base)}` : ''}</span></span></div>
      <div class="bar"><div style="width:${Math.max(0, Math.min(1, r ?? 0)) * 100}%;opacity:${1 - i * 0.1}"></div></div>
      ${step != null && !isRet ? `<div class="fstep ${step < 0.5 ? 'low' : ''}">↳ ${pct(step, 0)} de l’étape précédente</div>` : ''}</div>`;
  }).join('')}</div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">Joueurs vus pour la première fois sur la période. J1/J7 : parmi ceux dont le 1er / 7e jour après l’arrivée est terminé. <button class="cardbtn" data-act="csv" data-id="${id}">CSV</button></p>`;
}

function engagementHtml(e, coh) {
  const heat = (r, e2) => {
    if (!e2 || e2 < 5) return '<td class="heat" style="color:var(--muted)">—</td>';
    const v = r / e2;
    const t = Math.min(1, v / 0.4);
    return `<td class="heat num" style="background:color-mix(in srgb, var(--s1) ${Math.round(12 + t * 78)}%, transparent);color:${t > 0.55 ? '#fff' : 'var(--ink)'}">${pct(v, 0)}</td>`;
  };
  const byP = {};
  for (const r of coh) { const x = (byP[r.plat] ??= {}); for (const k of ['e1', 'r1', 'e7', 'r7', 'e30', 'r30']) x[k] = (x[k] ?? 0) + r[k]; }
  const sess = e.medianSession;
  return `<div class="mini">
    <div><small>Parties par joueur actif / jour</small><b class="num">${fmt(ratio(e.games, e.personDays), 1)}</b></div>
    <div><small>Actifs du jour / de la période</small><b class="num">${pct(ratio(e.personDays / Math.max(e.n, 1), e.users), 0)}</b></div>
    <div><small>Durée médiane de session</small><b class="num">${sess ? `${Math.floor(sess / 60)} min ${String(Math.round(sess % 60)).padStart(2, '0')}` : '—'}</b></div>
    <div><small>Joueurs du défi du jour</small><b class="num">${pct(ratio(e.daily, e.users), 0)}</b></div>
  </div>
  <table class="tbl heatt"><thead><tr><th>Rétention</th><th class="r">J1</th><th class="r">J7</th><th class="r">J30</th></tr></thead><tbody>
  ${['iOS', 'Android', 'Web'].filter((p) => byP[p]).map((p) => `<tr><td>${p}</td>${heat(byP[p].r1, byP[p].e1)}${heat(byP[p].r7, byP[p].e7)}${heat(byP[p].r30, byP[p].e30)}</tr>`).join('') || '<tr><td colspan="4" class="muted">Pas encore de cohorte.</td></tr>'}
  </tbody></table>`;
}

function revenueHtml(r, total, personDays, cohTot) {
  const a = r.admob ?? 0;
  const s = r.adsense ?? 0;
  const top = (r.byCountry ?? []).slice(0, 6);
  const W = val('growth', 'window', (v) => v);
  const byDay = Object.fromEntries((r.byDay ?? []).map((x) => [x.x, x]));
  const xs = W?.hourly ? [] : W?.buckets ?? [];
  return `<div class="mini">
    <div><small>Revenu total · ${per()}</small><b class="num">${eur(total)}</b> ${S.compare ? delta(total, r.prev) : ''}</div>
    <div><small>Par actif / jour</small><b class="num">${new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 4 }).format(total / (personDays || 1))}</b></div>
    <div><small>Par nouveau joueur</small><b class="num">${eur(ratio(total, cohTot?.n))}</b></div>
    <div><small>App / site</small><b class="num">${total ? pct(a / total, 0) : '—'}</b> <span class="muted">app</span></div>
  </div>
  <div class="split"><div style="width:${total ? (a / total) * 100 : 0}%;background:var(--s1)"></div><div style="width:${total ? (s / total) * 100 : 0}%;background:var(--s3)"></div></div>
  ${xs.length ? chart([
    { name: 'AdMob', color: 'var(--s1)', points: xs.map((x) => ({ x, y: byDay[x]?.admob ?? 0 })) },
    { name: 'AdSense', color: 'var(--s3)', points: xs.map((x) => ({ x, y: byDay[x]?.adsense ?? 0 })) },
  ], { type: 'bar', stacked: true, height: 120, fmtY: (x) => eur(x), name: 'revenus' }) : ''}
  <p class="flbl" style="margin:12px 0 6px">Par pays (tous pays)</p>
  ${hlist(top, { label: (x) => countryName(x.c), value: (x) => x.earnings, show: (x) => eur(x.earnings), color: 'var(--s3)', limit: 6 })}
  ${r.partial ? `<p class="muted" style="font-size:12px">${esc(r.partial)}</p>` : ''}`;
}

/** Effet d'un repère : téléchargements des 3 jours qui suivent vs les 3 d'avant. */
function effectOf(D, day) {
  if (!D) return null;
  const i = D.xs.indexOf(day);
  if (i < 3 || i + 2 >= D.xs.length) return null;
  const before = sumA(D.tot.slice(i - 3, i));
  const after = sumA(D.tot.slice(i, i + 3));
  return before ? (after - before) / before : null;
}
function journalHtml(D) {
  const p = part('growth', 'markers');
  if (!p.ok) return p.html;
  const W = val('growth', 'window', (v) => v);
  const list = p.v.list.filter((mk) => !W || mk.day >= W.buckets[0].slice(0, 10)).slice(0, 14);
  const rows = list.map((mk) => {
    const [kind, color] = MARK[mk.kind] ?? MARK.autre;
    const e = effectOf(D, mk.day);
    return `<div class="jrow"><span class="muted">${dm(mk.day)}</span><span class="lab" title="${esc(mk.label)}"><span class="mk" style="background:${color}">${kind}</span> ${esc(mk.label)}</span>
      <span class="num" style="font-weight:650;color:${e == null ? 'var(--muted)' : e >= 0 ? 'var(--good-ink)' : 'var(--bad-ink)'}">${e == null ? '—' : `${e >= 0 ? '+' : '−'}${fmt(Math.abs(e) * 100)} %`}</span>
      ${mk.manual ? `<button class="xbtn" data-act="mkdel" data-id="${mk.id}" aria-label="Supprimer le repère">×</button>` : '<span></span>'}</div>`;
  }).join('');
  const warn = p.v.warnings?.length ? `<p class="muted" style="font-size:12px">${esc(p.v.warnings.some((w) => /hq_markers/.test(w)) ? 'Repères manuels : table hq_markers pas encore créée (migration Supabase).' : p.v.warnings[0])}</p>` : '';
  return `${rows || '<div class="empty">Aucun repère sur la période.</div>'}
  <form class="addm" data-act="mkadd">
    <input type="date" name="day" value="${today()}" max="${today()}" aria-label="Date du repère" required>
    <select name="kind" aria-label="Type"><option value="campagne">Campagne</option><option value="version">Version</option><option value="push">Push</option><option value="autre">Autre</option></select>
    <input type="text" name="label" maxlength="120" placeholder="Ex. vidéo TikTok capitales" aria-label="Libellé" required>
    <button class="btn ghost" type="submit">Ajouter</button>
  </form>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Effet = téléchargements des 3 jours à partir du repère vs les 3 jours d’avant. Versions (PostHog) et push (Supabase) ajoutés tout seuls.</p>${warn}`;
}

async function markerWrite(method, body, id) {
  const { data: { session } } = await client.auth.getSession();
  const r = await fetch(`/api/hq?source=markers${id ? `&id=${id}` : ''}`, {
    method,
    headers: { authorization: `Bearer ${session?.access_token ?? S.token}`, 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(`Repère non enregistré : ${j.error ?? r.status}`); return; }
  await loadAll(true, ['growth']);
}

// ─── Événements (délégués) ───────────────────────────────────────────────────
function onAct(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (e.type === 'click') {
    if (['cmp', 'from', 'to', 'addc', 'mkadd'].includes(act)) return;
    if (act === 'csv') { e.preventDefault(); e.stopPropagation(); if (CSV[el.dataset.id]) downloadCsv(CSV[el.dataset.id]); return; }
    if (act === 'plat') return setFilters({ platform: el.dataset.v });
    if (act === 'preset') { const [, list, ex] = PRESETS[Number(el.dataset.k)]; return setFilters({ countries: [...list], exclude: ex }); }
    if (act === 'rmc') return setFilters({ countries: S.countries.filter((c) => c !== el.dataset.c) });
    if (act === 'tog') return toggleCountry(el.dataset.c);
    if (act === 'mapm') { S.mapMetric = el.dataset.v; return render(); }
    if (act === 'dlsrc') { S.dlSource = el.dataset.v; store('hq.dlsrc', S.dlSource); return render(); }
    if (act === 'sheet') { S.sheet = true; return render(); }
    if (act === 'close') { S.sheet = false; return render(); }
    if (act === 'reset') return setFilters({ countries: [], exclude: false, platform: 'all' });
    if (act === 'days') return pickDays(el.dataset.v);
    if (act === 'vprev') { S.previews[el.dataset.key] = !S.previews[el.dataset.key]; return render(); }
    if (act === 'vmove') return moveVideo(el.dataset.key, Number(el.dataset.dir));
    if (act === 'vpub') return publishVideo(el.dataset.key);
    if (act === 'vskip') return skipVideo(el.dataset.key);
    if (act === 'vunskip') return videoWrite('social-order', { unskip: el.dataset.key }, 'Vidéo remise dans la file.');
    if (act === 'adfmt') { S.adFormat = el.dataset.v; store('hq.adformat', S.adFormat); return render(); }
    if (act === 'vtab') { S.vtab = el.dataset.v; store('hq.vtab', S.vtab); return render(); }
    if (act === 'vreset') { if (confirm('Revenir à l’ordre automatique ?')) videoWrite('social-order', { pinned: [] }, 'Ordre automatique rétabli.'); return; }
    if (act === 'mkdel') { if (confirm('Supprimer ce repère ?')) markerWrite('DELETE', null, el.dataset.id); }
  } else if (e.type === 'change') {
    if (act === 'cmp') return setFilters({ compare: el.checked });
    if (act === 'addc' && el.value) { const c = el.value; el.value = ''; return setFilters({ countries: [...(S.exclude ? [] : S.countries), c], exclude: false }); }
    if ((act === 'from' || act === 'to') && el.value) {
      const r = { ...S.range, [act]: el.value };
      if (r.from > r.to) r[act === 'from' ? 'to' : 'from'] = el.value;
      return setFilters({ range: r });
    }
  } else if (e.type === 'submit' && act === 'vgen') {
    e.preventDefault();
    const f = new FormData(el);
    const record = f.get('record') === 'true';
    if (confirm(`Lancer un tournage ${record ? 'complet (avec l’app filmée)' : 'des formats animés'} ?`)) {
      videoWrite('social-generate', { record, globes: Number(f.get('globes')) }, 'Tournage lancé : les vidéos arrivent dans la banque à la fin.');
    }
  } else if (e.type === 'submit' && act === 'mkadd') {
    e.preventDefault();
    const f = new FormData(el);
    markerWrite('POST', { day: f.get('day'), kind: f.get('kind'), label: String(f.get('label') ?? '').trim() });
  }
}

function pickDays(v) {
  if (v === 'custom') {
    if (!S.range) setFilters({ range: { from: shiftDay(today(), -28), to: shiftDay(today(), -1) } });
    else render();
    return;
  }
  S.days = Number(v);
  store('hq.days', S.days);
  if (S.range) return setFilters({ range: null });
  S.data = {};
  restoreCache();
  render();
  loadAll();
}

const VIEWS = { overview, growth: growthView, players, acquisition, revenue, quality, deploys: deploysView, videos: videosView };

// ─── Rendu ───────────────────────────────────────────────────────────────────
let raf = 0;
function scheduleRender() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(render);
}
function render() {
  charts.length = 0;
  for (const k of Object.keys(CSV)) delete CSV[k];
  const focusAct = document.activeElement?.dataset?.act;
  // Les filtres pays / plateforme ne concernent pas les vidéos.
  $('#filters').innerHTML = S.tab === 'videos' ? '' : filtersHtml();
  $('#main').innerHTML = (VIEWS[S.tab] ?? overview)();
  $('#sheet').innerHTML = sheetHtml();
  document.body.style.overflow = S.sheet ? 'hidden' : '';
  if (focusAct === 'close' || (S.sheet && !document.activeElement?.closest?.('.sheet'))) $('#sheet .sheet')?.focus?.();
  mountCharts();
  document.querySelectorAll('#period button').forEach((b) => b.setAttribute('aria-pressed', String(S.range ? b.dataset.days === 'custom' : Number(b.dataset.days) === S.days)));
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const times = Object.values(S.data).map((d) => d?.fetchedAt).filter(Boolean).sort();
  $('#stamp').textContent = S.pending.size
    ? `Chargement… (${SOURCES.length - S.pending.size}/${SOURCES.length} sources)`
    : times.length ? `Données ${ago(times[0])} · ${S.range ? `du ${dm(S.range.from)} au ${dm(S.range.to)}` : S.days === 1 ? '24 dernières heures' : `${S.days} derniers jours`}` : '';
}

function buildTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label, icon]) => `<button role="tab" data-tab="${id}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${label}</button>`).join('');
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    S.tab = b.dataset.tab;
    store('hq.tab', S.tab);
    render();
    window.scrollTo({ top: 0 });
  });
  document.querySelectorAll('#period button').forEach((b) => b.addEventListener('click', () => pickDays(b.dataset.days)));
  for (const t of ['click', 'change', 'submit']) document.addEventListener(t, onAct);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = false; render(); } });
  $('#refresh').addEventListener('click', () => loadAll(true));
  $('#theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store('hq.theme', next);
    render();
  });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  // Actualisation auto toutes les 5 min quand la page est visible.
  setInterval(() => { if (document.visibilityState === 'visible') loadAll(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => {
    const t = Object.values(S.data).map((d) => d?.fetchedAt).filter(Boolean).sort()[0];
    if (document.visibilityState === 'visible' && (!t || Date.now() - new Date(t) > 5 * 60000)) loadAll();
  });
}

function forbidden() {
  $('#app').classList.add('hide');
  $('#login').classList.remove('hide');
  const e = $('#login-err');
  e.textContent = 'Ce compte n’est pas administrateur.';
  e.classList.remove('hide');
}

async function start() {
  const theme = store('hq.theme');
  if (theme) document.documentElement.dataset.theme = theme;
  const cfg = await fetch('/api/hq?source=config').then((r) => r.json());
  client = createClient(cfg.supabaseUrl, cfg.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  client.auth.onAuthStateChange((_e, session) => { S.token = session?.access_token ?? null; });
  const { data: { session } } = await client.auth.getSession();
  if (!session) return showLogin();
  S.token = session.access_token;
  showApp();
}

function showLogin() {
  $('#login').classList.remove('hide');
  $('#app').classList.add('hide');
}
let started = false;
function showApp() {
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  if (!started) {
    buildTabs();
    started = true;
    fetch('/hq/world.json').then((r) => r.json()).then((w) => { S.world = w; scheduleRender(); }).catch(() => {});
  }
  restoreCache();
  render();
  loadAll();
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#login-err');
  err.classList.add('hide');
  const { data, error } = await client.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
  if (error) { err.textContent = error.message; err.classList.remove('hide'); return; }
  S.token = data.session.access_token;
  showApp();
});

start().catch((e) => { document.body.innerHTML = `<p class="err" style="margin:20px">${esc(e.message)}</p>`; });
</script>
