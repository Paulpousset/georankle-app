<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Icône GeoG : la rose des vents de l'ancienne icône, dont le cercle
       ocre devient un G (ouvert en haut à droite, barre qui rejoint la
       branche Est). Fond plein, sans transparence : iOS et Google Play
       appliquent eux-mêmes leur masque.
       render.js réutilise le groupe #mark (sans le fond) pour l'icône
       adaptative Android, le splash et le logo du site. -->
  <defs>
    <radialGradient id="parch" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#f8f2e3"/>
      <stop offset="1" stop-color="#e3d2ac"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2c1810" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect id="bg" width="1024" height="1024" fill="url(#parch)"/>

  <g id="mark">
    <!-- Le G : arc de -55° à 0° par le haut, la gauche et le bas, puis la barre -->
    <path d="M725.4 207.3 A372 372 0 1 0 884 512" fill="none" stroke="#c4872a" stroke-width="30"/>
    <rect x="742.6" y="497" width="156.4" height="30" fill="#c4872a"/>

    <!-- Rose des vents -->
    <g filter="url(#soft)" transform="translate(512 512)">
      <g fill="#d99a3c">
        <polygon points="0,-215 36,0 0,21.6 -36,0" transform="rotate(45)"/>
        <polygon points="0,-215 36,0 0,21.6 -36,0" transform="rotate(135)"/>
        <polygon points="0,-215 36,0 0,21.6 -36,0" transform="rotate(225)"/>
        <polygon points="0,-215 36,0 0,21.6 -36,0" transform="rotate(315)"/>
      </g>
      <g transform="rotate(90)"><polygon points="0,-330 70,0 0,0" fill="#132040"/><polygon points="0,-330 -70,0 0,0" fill="#2d4a70"/></g>
      <g transform="rotate(180)"><polygon points="0,-330 70,0 0,0" fill="#132040"/><polygon points="0,-330 -70,0 0,0" fill="#2d4a70"/></g>
      <g transform="rotate(270)"><polygon points="0,-330 70,0 0,0" fill="#132040"/><polygon points="0,-330 -70,0 0,0" fill="#2d4a70"/></g>
      <!-- Nord : vert forêt, pointe rouge -->
      <polygon points="0,-330 70,0 0,0" fill="#2a6e3f"/>
      <polygon points="0,-330 -70,0 0,0" fill="#1d5430"/>
      <polygon points="0,-330 21,-237.6 -21,-237.6" fill="#8b1a1a"/>
      <circle r="73.5" fill="#f8f2e3" stroke="#c4872a" stroke-width="15.4"/>
      <circle r="31.5" fill="#132040"/>
    </g>
  </g>
</svg>
