<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon : la même icône, recadrée sur le G et avec un trait plus épais
       pour rester lisible à 16–48 px (Google, onglets). Fond plein, sans
       coins transparents : Google recadre en cercle et noircit la
       transparence. -->
  <defs>
    <radialGradient id="parch" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#f8f2e3"/>
      <stop offset="1" stop-color="#e3d2ac"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#parch)"/>
  <g transform="translate(256 256) scale(0.56)">
    <path d="M213.4 -304.7 A372 372 0 1 0 372 0" fill="none" stroke="#c4872a" stroke-width="56"/>
    <rect x="230.6" y="-28" width="169.4" height="56" fill="#c4872a"/>
    <g fill="#d99a3c">
      <polygon points="0,-215 40,0 0,24 -40,0" transform="rotate(45)"/>
      <polygon points="0,-215 40,0 0,24 -40,0" transform="rotate(135)"/>
      <polygon points="0,-215 40,0 0,24 -40,0" transform="rotate(225)"/>
      <polygon points="0,-215 40,0 0,24 -40,0" transform="rotate(315)"/>
    </g>
    <g fill="#132040">
      <polygon points="0,-330 76,0 -76,0" transform="rotate(90)"/>
      <polygon points="0,-330 76,0 -76,0" transform="rotate(180)"/>
      <polygon points="0,-330 76,0 -76,0" transform="rotate(270)"/>
    </g>
    <polygon points="0,-330 76,0 -76,0" fill="#2a6e3f"/>
    <polygon points="0,-330 0,0 -76,0" fill="#1d5430"/>
    <polygon points="0,-330 24,-230 -24,-230" fill="#8b1a1a"/>
    <circle r="80" fill="#f8f2e3" stroke="#c4872a" stroke-width="18"/>
    <circle r="36" fill="#132040"/>
  </g>
</svg>
