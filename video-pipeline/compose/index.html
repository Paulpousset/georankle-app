<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1290, height=2796" />
    <!--
      L'app preview de l'App Store, trente secondes, au format natif de la
      prise (iPhone 6,9" : 1290×2796). Le Play Store et les formats courts en
      dérivent par recadrage (voir cut.mjs) plutôt que par un second montage.

      Ce fichier ne contient aucune image : les plans sont les rushes de
      `assets/clips/`, coupés aux instants que `assets/tour.json` désigne — une
      bonne réponse, une rotation, une frappe. Changer un titre ne rejoue rien.

      GSAP et les polices sont locaux : le Chrome du rendu n'a pas de réseau,
      et un CDN casserait de toute façon le déterminisme du rendu.
    -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        font-weight: 700;
        src: url("assets/fonts/playfair-display-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Mono";
        font-weight: 400;
        src: url("assets/fonts/space-mono-400-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Mono";
        font-weight: 700;
        src: url("assets/fonts/space-mono-700-latin.woff2") format("woff2");
      }

      /* La palette de l'app, telle qu'elle est à l'écran. */
      :root {
        --cream: #f3e7cc;
        --sand: #e4d2a6;
        --vermilion: #c6431c;
        --brown: #2c1b12;
        --night: #0f1f3d;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1290px; height: 2796px; overflow: hidden;
        background: var(--brown);
        font-family: "Space Mono", "Courier New", monospace;
      }
      #root { position: relative; width: 1290px; height: 2796px; }

      .clip { position: absolute; inset: 0; }
      video.shot { width: 1290px; height: 2796px; object-fit: cover; }

      /*
        Le sous-titre : une pastille basse, lisible sur le fond crème comme sur
        le bleu nuit du globe. Bas et centré — la zone que le pouce ne cache
        pas quand on regarde une fiche store sur son téléphone.
      */
      .caption {
        inset: auto 0 300px 0;
        display: flex; justify-content: center;
        pointer-events: none;
      }
      .caption > span {
        display: inline-block;
        padding: 26px 54px;
        border-radius: 999px;
        background: rgba(44, 27, 18, 0.88);
        color: var(--cream);
        font-weight: 700; font-size: 52px; letter-spacing: 1px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        will-change: transform, opacity;
      }
      .caption > span em {
        font-style: normal; color: var(--sand);
      }

      /* Les cartons : ouverture et fermeture, pleine page, aux couleurs de l'app. */
      .card {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 40px; text-align: center;
        background: var(--cream);
        color: var(--brown);
      }
      .card h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700; font-size: 260px; line-height: 1;
        letter-spacing: -6px;
      }
      .card p { font-size: 54px; letter-spacing: 3px; text-transform: uppercase; }
      .card .stores { font-size: 44px; color: var(--vermilion); font-weight: 700; }
      .card .url {
        margin-top: 60px; padding: 30px 70px; border-radius: 999px;
        background: var(--vermilion); color: var(--cream);
        font-size: 60px; font-weight: 700;
      }
      /* Un voile crème pour ouvrir en douceur sur le premier plan. */
      #veil { background: var(--cream); pointer-events: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1290"
      data-height="2796"
      data-fps="30"
    >
      <!--
        Les plans. `data-media-start` est le point d'entrée dans le rush, en
        secondes : chaque valeur vient du manifeste ou du journal de la prise —
        la rotation du globe commence peu après « Commencer », la frappe dans
        « Devinez le Pays » à la 13e seconde, la bonne réponse en Silhouette à
        la 37e (Oman ✓), en Capitales à la 34e (Asmara ✓, verdict compris), la bascule sombre
        à la 14e.
      -->
      <video id="shot-accueil" class="clip shot" data-start="0"    data-duration="3.2" data-media-start="0"    src="assets/clips/accueil.mp4"    muted playsinline preload="auto"></video>
      <video id="shot-globe" class="clip shot" data-start="3.2"  data-duration="6.5" data-media-start="12.5" src="assets/clips/globe.mp4"      muted playsinline preload="auto"></video>
      <video id="shot-devine" class="clip shot" data-start="9.7"  data-duration="5.3" data-media-start="13.3" src="assets/clips/devine.mp4"     muted playsinline preload="auto"></video>
      <video id="shot-silhouette" class="clip shot" data-start="15"   data-duration="5.6" data-media-start="32.6" src="assets/clips/silhouette.mp4" muted playsinline preload="auto"></video>
      <video id="shot-capitales" class="clip shot" data-start="20.6" data-duration="5.2" data-media-start="29.6" src="assets/clips/capitales.mp4"  muted playsinline preload="auto"></video>
      <video id="shot-theme" class="clip shot" data-start="25.8" data-duration="2.8" data-media-start="12.8" src="assets/clips/theme.mp4"      muted playsinline preload="auto"></video>

      <!-- Les sous-titres, un par plan. -->
      <div class="clip caption" id="cap-1" data-start="0.6"  data-duration="2.6"><span>Drapeaux · Capitales · <em>Globe 3D</em></span></div>
      <div class="clip caption" id="cap-2" data-start="3.6"  data-duration="6.1"><span>Fais tourner le <em>globe</em></span></div>
      <div class="clip caption" id="cap-3" data-start="10.1" data-duration="4.9"><span>Devine le pays à ses <em>indices</em></span></div>
      <div class="clip caption" id="cap-4" data-start="15.4" data-duration="5.2"><span>Reconnais sa <em>silhouette</em></span></div>
      <div class="clip caption" id="cap-5" data-start="21"   data-duration="4.8"><span>Duo, carré ou <em>cash</em></span></div>
      <div class="clip caption" id="cap-6" data-start="26.1" data-duration="2.5"><span>Clair ou <em>sombre</em></span></div>

      <!-- Le voile d'ouverture, et le carton de fin. -->
      <div class="clip" id="veil" data-start="0" data-duration="0.8"></div>
      <div class="clip card" id="outro" data-start="28.6" data-duration="1.4">
        <h1>GeoG</h1>
        <p>Le jeu de géographie</p>
        <p class="stores">Gratuit · iOS &amp; Android</p>
        <div class="url">playgeog.com</div>
      </div>
    </div>

    <script>
      // Une seule timeline racine, en pause : c'est le moteur de rendu qui la
      // fait avancer image par image. Tout est positionné en absolu (le
      // troisième argument) — jamais en relatif, sinon un plan qu'on
      // raccourcit décale tous les suivants.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Chaque sous-titre monte de quelques pixels en apparaissant et se
      // dissout un peu avant la coupe : une pastille encore visible au moment
      // du changement de plan « saute » avec lui.
      for (const el of document.querySelectorAll(".caption")) {
        const start = parseFloat(el.dataset.start);
        const end = start + parseFloat(el.dataset.duration);
        const pill = el.querySelector("span");
        tl.fromTo(pill, { y: 46, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, start);
        tl.to(pill, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, end - 0.3);
      }

      // Le voile crème s'efface sur l'accueil ; le carton de fin se pose.
      tl.to("#veil", { opacity: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#outro", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 28.6);
      tl.fromTo("#outro h1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 28.7);
      tl.fromTo("#outro .url", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 29.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
