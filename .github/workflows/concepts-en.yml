name: Concepts courts en anglais (temporaire)

# Versions anglaises des shorts Frontières / Devine (concepts.mjs --lang en,
# liste social-video/composer/redo-en.txt), ajoutées à la release shorts-next.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    name: Fiches + voix off
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fiches et voix
        working-directory: social-video/composer
        env:
          XI_API_KEY: ${{ secrets.XI_API_KEY }}
          XI_VOICE: ${{ vars.XI_VOICE }}
          XI_VOICE_EN: ${{ vars.XI_VOICE_EN }}
          XI_MODEL: ${{ vars.XI_MODEL }}
        run: |
          [ -n "$XI_API_KEY" ] || { echo "XI_API_KEY absente"; exit 1; }
          npm ci --no-audit --no-fund
          node concepts.mjs --lang en --short --seed 15 --redo redo-en.txt
          node voice.mjs
          ls public/voice/*.mp3 | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: concepts-en-plan
          path: |
            social-video/out/episodes/
            social-video/composer/public/voice/
          include-hidden-files: true

  render:
    name: Rendu ${{ matrix.shard }}/4
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: concepts-en-plan
          path: social-video
      - name: Rendu
        working-directory: social-video/composer
        env:
          SHARD: ${{ matrix.shard }}/4
        run: |
          npm ci --no-audit --no-fund
          node concepts.mjs --assets
          node render.mjs
          cd ../out/final
          for f in *.mp4; do
            ffmpeg -y -loglevel error -i "$f" -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a copy -movflags +faststart "tmp-$f"
            mv "tmp-$f" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: concepts-en-final-${{ matrix.shard }}
          path: social-video/out/final/

  release:
    name: Ajout à shorts-next
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: concepts-en-final-*
          merge-multiple: true
          path: final
      - name: Envoi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(final/*-en-v1.mp4 final/*-en-v1.txt)
          echo "${#files[@]} fichiers"
          [ ${#files[@]} -eq 34 ] || { ls final; exit 1; }
          gh release upload shorts-next "${files[@]}" --clobber --repo "${{ github.repository }}"
