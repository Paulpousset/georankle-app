name: Vidéos réseaux sociaux

# Filme l'app Android NATIVE dans un émulateur (flows Maestro de
# social-video/maestro), monte les shorts 9:16 (Remotion) et les dépose en
# artefact du run, avec le texte de chaque publication. Rien n'est posté :
# on télécharge l'artefact et on publie depuis son téléphone.
#
# Le build `recording` (eas.json) est réutilisé tant qu'il existe ; cocher
# « rebuild » après un changement d'écran pour en refaire un sur EAS.
#
# Secret requis : EXPO_TOKEN (déjà utilisé par release.yml).
# Secret optionnel : XI_API_KEY (ElevenLabs) pour la voix off ; variables de
# dépôt optionnelles XI_VOICE, XI_VOICE_FR, XI_VOICE_EN, XI_MODEL.
on:
  # Une fournée chaque lundi matin, avec les valeurs par défaut.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      flows:
        description: Flows à tourner (vide = tous), séparés par des espaces
        required: false
      langs:
        description: Langues
        default: fr en
        required: true
      variants:
        description: Accroches par vidéo
        default: '2'
        required: true
      rebuild:
        description: Refaire le build `recording` sur EAS
        type: boolean
        default: false

# contents: write pour publier les shorts en release (lisibles depuis le
# téléphone, sans dézipper d'artefact).
permissions:
  contents: write

concurrency:
  group: social-video
  cancel-in-progress: false

jobs:
  record-and-render:
    name: Tournage Android + montage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build `recording` (APK)
        env:
          REBUILD: ${{ github.event.inputs.rebuild || 'false' }}
        run: |
          # eas lit app.json et ses plugins : il lui faut les dépendances, même
          # pour lister les builds.
          npm ci --no-audit --no-fund
          url=""
          if [ "$REBUILD" != "true" ]; then
            url=$(eas build:list --platform android --build-profile recording --status finished \
              --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl // empty') || url=""
          fi
          if [ -z "$url" ]; then
            url=$(eas build --platform android --profile recording --wait --json --non-interactive \
              | jq -r '.[0].artifacts.buildUrl')
          fi
          echo "APK : $url"
          curl -fsSL "$url" -o geog-recording.apk

      - name: Maestro + polices emoji
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tournage dans l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LANGS: ${{ github.event.inputs.langs || 'fr en' }}
          FLOWS: ${{ github.event.inputs.flows }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r geog-recording.apk
            ./social-video/record.sh android $FLOWS

      - name: Montage
        working-directory: social-video/composer
        env:
          VARIANTS: ${{ github.event.inputs.variants || '2' }}
          XI_API_KEY: ${{ secrets.XI_API_KEY }}
          XI_VOICE: ${{ vars.XI_VOICE }}
          XI_VOICE_FR: ${{ vars.XI_VOICE_FR }}
          XI_VOICE_EN: ${{ vars.XI_VOICE_EN }}
          XI_MODEL: ${{ vars.XI_MODEL }}
        run: |
          npm ci --no-audit --no-fund
          node plan.mjs --variants "$VARIANTS"
          node voice.mjs
          node render.mjs

      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: social-video/out/
          if-no-files-found: warn

      # Les shorts finis dans une release (pré-version, pas une version de
      # l'app) : chaque vidéo s'ouvre et se télécharge depuis le téléphone.
      - name: Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(social-video/out/final/*.mp4 social-video/out/final/*.txt)
          [ ${#files[@]} -gt 0 ] || { echo "Aucun short à publier"; exit 0; }
          gh release create "shorts-${{ github.run_number }}" "${files[@]}" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Shorts #${{ github.run_number }}" \
            --notes "Shorts tournés sur l'app Android par le workflow « Vidéos réseaux sociaux ». Chaque .txt contient le texte à coller sous la vidéo du même nom."
