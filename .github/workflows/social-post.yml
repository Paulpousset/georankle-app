name: Publication réseaux sociaux

# Publie les shorts des releases `shorts-N` (social-video/publish/post.mjs) :
# - TikTok + Instagram (Zernio) deux fois par jour, 12 h 30 et 19 h 30 à Paris :
#   le quiz « globe » à midi, une vidéo de l'app le soir (KIND=auto) ;
# - YouTube (Upload-Post gratuit, 10 envois/mois) tous les 3 jours, 10 fois
#   par mois.
#
# Pour tout couper : variable de dépôt SOCIAL_POST_ENABLED = false (le
# workflow tourne alors en simulation, rien ne part).
#
# Secrets : ZERNIO_API_KEY et/ou UPLOAD_POST_API_KEY.
# Variables : UPLOAD_POST_USER (profil Upload-Post), SOCIAL_POST_ENABLED,
# optionnelles UPLOAD_POST_PLATFORMS, SOCIAL_POST_LANGS, SOCIAL_POST_MIN_RELEASE.
on:
  # Heures en UTC, calées sur l'heure d'été de Paris (UTC+2) : en hiver les
  # publications partent une heure plus tôt (11 h 30 et 18 h 30).
  schedule:
    - cron: '30 10 * * *'
    - cron: '30 17 * * *'
    - cron: '0 16 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch:
    inputs:
      target:
        description: Où publier
        type: choice
        options: [social, youtube, all]
        default: social
      kind:
        description: Quel format (auto = globe avant 16 h à Paris, app après)
        type: choice
        options: [auto, globe, app]
        default: auto
      count:
        description: Vidéos à publier
        default: '1'
        required: true
      dry_run:
        description: Simulation (ne rien publier)
        type: boolean
        default: true

# contents: write pour tenir à jour posted.json dans la release shorts-state.
permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    name: Publier le prochain short
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          UPLOAD_POST_PLATFORMS: ${{ vars.UPLOAD_POST_PLATFORMS }}
          LANGS: ${{ vars.SOCIAL_POST_LANGS || 'fr' }}
          # 23 : premier tournage avec le quiz globe et le montage serré de l'app.
          MIN_RELEASE: ${{ vars.SOCIAL_POST_MIN_RELEASE || '23' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
          # Tâche planifiée seulement : si une publication manuelle a déjà
          # rempli le créneau, ne pas en refaire une.
          MIN_GAP_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target || (startsWith(github.event.schedule, '0 16') && 'youtube' || 'social') }}
          # Publication réelle sauf si coupée (SOCIAL_POST_ENABLED = false) ou
          # si la case « Simulation » est cochée au lancement manuel.
          DRY_RUN: ${{ (vars.SOCIAL_POST_ENABLED != 'false' && github.event.inputs.dry_run != 'true') && '0' || '1' }}
        run: node social-video/publish/post.mjs
